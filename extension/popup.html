<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Legacy Spell Updater</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px 16px;
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
      color: #222;
      background: #fff;
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 14px;
    }
    h1 img { width: 24px; height: 24px; }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid #eee;
      cursor: pointer;
    }
    label.sub { padding-left: 14px; }
    label.disabled { opacity: 0.45; cursor: default; }
    label.disabled input { cursor: default; }
    .hint { display: block; color: #777; font-size: 11px; }
    .badge {
      padding: 0 3px;
      border-radius: 3px;
      background: #6d4bb8;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
    }
    input[type="checkbox"] {
      appearance: none;
      flex: none;
      position: relative;
      width: 32px;
      height: 18px;
      margin: 0;
      border-radius: 9px;
      background: #ccc;
      cursor: pointer;
      transition: background 0.15s;
    }
    input[type="checkbox"]::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }
    input[type="checkbox"]:checked { background: #6d4bb8; }
    input[type="checkbox"]:checked::after { transform: translateX(14px); }
    input[type="checkbox"]:focus-visible { outline: 2px solid #6d4bb8; outline-offset: 2px; }
    footer {
      padding-top: 8px;
      border-top: 1px solid #eee;
      color: #777;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1><img src="icons/icon-48.png" alt="">Legacy Spell Updater</h1>
  <label>
    <span>Update legacy spell links
      <span class="hint">Point 2014 spells at their 2024 versions</span></span>
    <input type="checkbox" data-setting="enabled">
  </label>
  <label>
    <span>Show <span class="badge">24</span> badge
      <span class="hint">Marks each spell link that was swapped</span></span>
    <input type="checkbox" data-setting="showBadge" data-requires="enabled">
  </label>
  <label class="sub">
    <span>Click badge for 2014 version
      <span class="hint">The badge links to the original spell</span></span>
    <input type="checkbox" data-setting="badgeLinksToLegacy" data-requires="enabled showBadge">
  </label>
  <label>
    <span>Show count on toolbar icon
      <span class="hint">Number of spells swapped on this page</span></span>
    <input type="checkbox" data-setting="showCount" data-requires="enabled">
  </label>
  <footer id="info"></footer>
  <script src="popup.js"></script>
</body>
</html>
