<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { width: 1280px; height: 800px; display: flex; align-items: center; gap: 48px; padding: 0 56px; }
  .copy { flex: 0 0 360px; }
  h1 { margin: 0 0 20px; font-size: 44px; line-height: 1.1; }
  p { margin: 0 0 16px; font-size: 21px; line-height: 1.45; color: #4a4361; }
  .shot { flex: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 18px 50px rgba(48, 24, 110, 0.25); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <h1>Legacy monsters, 2024 spells</h1>
    <p>Spell links in 2014 stat blocks open and preview the 2024 version.</p>
    <p>A <span class="badge">24</span> badge marks every swapped spell.</p>
  </div>
  <div class="shot"><img src="../../../images/stat-block.jpg" alt=""></div>
</body>
</html>
